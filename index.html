<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Họp Trực Tuyến</title>
    <!-- Tải Jitsi API -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        /* Màn hình đăng nhập/chọn quyền */
        #entry-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2c2c;
        }
        .login-box {
            background: #3d3d3d;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-user {
            background-color: #28a745;
        }
        .btn-user:hover {
            background-color: #218838;
        }
        hr {
            border: 0;
            height: 1px;
            background: #555;
            margin: 20px 0;
        }
        /* Khung chứa phòng họp Jitsi */
        #meet-container { 
            width: 100%; 
            height: 100vh; 
            display: none; /* Ẩn đi cho đến khi click tham gia */
        }
    </style>
</head>
<body>
    <!-- Màn hình chờ tham gia -->
    <div id="entry-screen">
        <div class="login-box">
            <h3>Tham gia phòng họp</h3>
            
            <!-- Nút cho người dùng bình thường -->
            <button class="btn-user" onclick="joinMeeting(false)">Tham gia họp</button>
            
            <hr>
            
            <!-- Khu vực cho Quản trị viên -->
            <h4>Dành cho Quản trị viên</h4>
            <input type="password" id="admin-password" placeholder="Nhập mật khẩu Admin">
            <button onclick="joinMeeting(true)">Đăng nhập Admin</button>
        </div>
    </div>

    <!-- Khung Jitsi -->
    <div id="meet-container"></div>

    <script>
        const ADMIN_PASS = "dian@123";

        function joinMeeting(isAdmin) {
            if (isAdmin) {
                const pass = document.getElementById('admin-password').value;
                if (pass !== ADMIN_PASS) {
                    alert("Mật khẩu Quản trị viên không đúng!");
                    return; // Dừng lại nếu sai mật khẩu
                }
            }

            // Ẩn màn hình chờ và hiện khung Jitsi
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('meet-container').style.display = 'block';

            // Tên miền của máy chủ Jitsi miễn phí[cite: 1]
            const domain = 'meet.jit.si';
            
            // Cấu hình phòng họp[cite: 1]
            const options = {
                roomName: 'PhongHopTrucTuyen', // Đổi tên này để tạo phòng riêng của bạn[cite: 1]
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#meet-container'),
                configOverwrite: { 
                    startWithAudioMuted: true, // Tắt mic khi mới vào[cite: 1]
                    startWithVideoMuted: false // Mở cam khi mới vào[cite: 1]
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false[cite: 1]
                }
            };
            
            // Khởi tạo phòng họp[cite: 1]
            const api = new JitsiMeetExternalAPI(domain, options);

            // Phân quyền: Đổi tên hiển thị tự động nếu là Admin
            api.on('videoConferenceJoined', function () {
                if (isAdmin) {
                    api.executeCommand('displayName', 'Admin (Host)');
                } else {
                    // Tùy chọn: Mở hộp thoại yêu cầu người dùng thường tự nhập tên
                    // api.executeCommand('displayName', 'Khách'); 
                }
            });
        }
    </script>
</body>
</html>
